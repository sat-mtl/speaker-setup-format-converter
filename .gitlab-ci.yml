.macos_saas_runners:
  tags:
    - saas-macos-medium-m1
  image: macos-15-xcode-16
  before_script:
    - echo "started by ${GITLAB_USER_NAME}"

.shared_windows_runners:
  tags:
    - saas-windows-medium-amd64
  before_script:
    - Set-Variable -Name "time" -Value (date -Format "%H:%m")
    - echo ${time}
    - echo "started by ${GITLAB_USER_NAME}"

image: almalinux:9

stages:
  - build
  - test
  - deploy

build:linux:
  stage: build
  tags:
    - gitlab-org
  before_script:
    # Install required packages including updated tools
    - yum -y update && yum -y install epel-release dnf-plugins-core && dnf config-manager --set-enabled crb && yum -y update && yum clean all && yum -y install llvm-toolset gcc-toolset-14   glibc-devel alsa-lib-devel mesa-libGL-devel libxkbcommon-x11-devel zlib-devel ncurses-devel       wget xz git cmake xcb-util xcb-util-devel libX11-devel libXrender-devel libXi-devel dbus-devel glib2-devel mesa-libGL-devel   nasm libxkbcommon-x11-devel alsa-lib-devel glib2-devel libxcb-devel xcb-util xcb-util-image xcb-util-keysyms xcb-util-image-devel xcb-util-renderutil-devel   vulkan vulkan-devel xcb-util-wm xcb-util-wm-devel libxkbcommon-devel libXcomposite-devel xcb-util-keysyms-devel   libv4l-devel   xcb-util-cursor-devel   libxcb-devel pulseaudio-libs-devel   rsync   bluez-libs-devel avahi-devel  wayland-devel  wayland-protocols-devel libwayland-egl libwayland-cursor libwayland-client ninja-build  libxkbfile-devel xcb-util xorg-x11-proto-devel bzip2 systemd-devel systemd-udev mesa-libgbm-devel libzstd-devel  && yum clean all

    # Download OSSIA SDK
    - curl -L -O "https://github.com/ossia/score/raw/master/tools/fetch-sdk.sh"
    - chmod +x fetch-sdk.sh
    - ./fetch-sdk.sh
    # Download and extract Boost
    - curl -L "https://github.com/ossia/sdk/releases/download/sdk31/boost_1_88_0.tar.gz" -o boost_1_88_0.tar.gz
    - tar xzf boost_1_88_0.tar.gz -C /opt/
    - ls /opt
    - find /opt -name Qt6Config.cmake
  script:
    - mkdir -p build
    # Use OSSIA SDK's clang compiler
    - export PATH=/opt/ossia-sdk-x86_64/llvm/bin:$PATH
    - ls /opt
    - find /opt -name Qt6Config.cmake
    - ls /opt/ossia-sdk-x86_64/qt6-static/lib/cmake
    - export OSSIA_SDK=/opt/ossia-sdk-x86_64
    - export CMAKE_PREFIX_PATH="${OSSIA_SDK};${OSSIA_SDK}/qt6-static;${OSSIA_SDK}/qt6-static/lib;${OSSIA_SDK}/qt6-static/lib/cmake;${OSSIA_SDK}/llvm;${OSSIA_SDK}/fftw;${OSSIA_SDK}/zlib;${OSSIA_SDK}/openssl;${OSSIA_SDK}/freetype;${OSSIA_SDK}/harfbuzz;${OSSIA_SDK}/pipewire;${OSSIA_SDK}/sysroot;${OSSIA_SDK}/sysroot/lib;${OSSIA_SDK}/sysroot/lib/cmake;${OSSIA_SDK}/sysroot/lib/cmake/freetype;${OSSIA_SDK}/sysroot/lib/cmake/harfbuzz;${OSSIA_SDK}/sysroot/lib/cmake/liblzma;${OSSIA_SDK}/sysroot/lib/cmake/Snappy;${OSSIA_SDK}/sysroot/lib/cmake/zstd;${OSSIA_SDK}/qt6-static/lib64;${OSSIA_SDK}/llvm-libs/lib64;${OSSIA_SDK}/zlib/lib64;${OSSIA_SDK}/openssl/lib64;${OSSIA_SDK}/freetype/lib64;${OSSIA_SDK}/harfbuzz/lib64"
    - CC=/opt/ossia-sdk-x86_64/llvm/bin/clang CXX=/opt/ossia-sdk-x86_64/llvm/bin/clang++ cmake -S $PWD -B build -GNinja -DCMAKE_PREFIX_PATH="$CMAKE_PREFIX_PATH" -DBOOST_ROOT="/opt/boost_1_88_0" -DBUILD_TESTING=0 --debug-find-pkg=Qt6Core -DQT_DEBUG_FIND_PACKAGE=ON 
    - cmake --build build
  artifacts:
    expire_in: 2 hrs
    paths:
      - build/

build:windows:
  stage: build
  extends:
    - .shared_windows_runners
  before_script:
    # Install required tools with latest versions
    - choco install -y cmake --version=3.31.3
    - choco install -y ninja
    - choco install -y msys2
    # Download OSSIA SDK
    - Invoke-WebRequest -Uri "https://github.com/ossia/score/raw/master/tools/fetch-sdk.sh" -OutFile "fetch-sdk.sh"
    - bash fetch-sdk.sh
    # Download and extract Boost
    - Invoke-WebRequest -Uri "https://github.com/ossia/sdk/releases/download/sdk31/boost_1_88_0.tar.gz" -OutFile "boost_1_88_0.tar.gz"
    - tar xzf boost_1_88_0.tar.gz -C C:\
  script:
    # Use OSSIA SDK's clang compiler for Windows
    - $env:PATH = "C:\ossia-sdk-x86_64\llvm\bin;$env:PATH"
    - cmake -S . -B build -GNinja -DCMAKE_C_COMPILER="C:/ossia-sdk-x86_64/llvm/bin/clang.exe" -DCMAKE_CXX_COMPILER="C:/ossia-sdk-x86_64/llvm/bin/clang++.exe" -DCMAKE_PREFIX_PATH="C:/ossia-sdk-x86_64;C:/ossia-sdk-x86_64/qt6-static;C:/ossia-sdk-x86_64/qt6-static/lib" -DBOOST_ROOT="C:/boost_1_88_0" -DBUILD_TESTING=0
    - cmake --build build
  artifacts:
    expire_in: 2 hrs
    paths:
      - build/

build:mac:
  stage: build
  extends:
    - .macos_saas_runners
  
  before_script:
    # Update and install required tools
    - brew update
    - brew install cmake ninja
    # Ensure latest Xcode is selected
    - sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
    # Download OSSIA SDK
    - curl -L -O "https://github.com/ossia/score/raw/master/tools/fetch-sdk.sh"
    - chmod +x fetch-sdk.sh
    - ./fetch-sdk.sh
    # Download and extract Boost
    - curl -L "https://github.com/ossia/sdk/releases/download/sdk31/boost_1_88_0.tar.gz" -o boost_1_88_0.tar.gz
    - tar xzf boost_1_88_0.tar.gz -C /opt/
  script:
    - mkdir -p build
    # OSSIA SDK on macOS uses system compiler, just add SDK to prefix path
    - cmake -S $PWD -B build -GNinja -DCMAKE_PREFIX_PATH="/opt/ossia-sdk-aarch64" -DBOOST_ROOT="/opt/boost_1_88_0" -DBUILD_TESTING=0
    - cmake --build build
  artifacts:
    expire_in: 2 hrs
    paths:
      - build/

# Run test
test:linux:
  stage: test
  tags:
    - gitlab-org
  script:
    - cd build
    - ctest -V --output-on-failure
  dependencies:
    - build:linux

test:windows:
  stage: test
  extends:
    - .shared_windows_runners
  script:
    - cd build
    - ctest -V --output-on-failure
  dependencies:
    - build:windows

test:mac:
  stage: test
  extends:
    - .macos_saas_runners
  script:
    - cd build
    - ctest -V --output-on-failure
  dependencies:
    - build:mac

