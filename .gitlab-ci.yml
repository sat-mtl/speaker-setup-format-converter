.macos_saas_runners:
  tags:
    - saas-macos-medium-m1
  image: macos-15-xcode-16
  before_script:
    - echo "started by ${GITLAB_USER_NAME}"

.shared_windows_runners:
  tags:
    - saas-windows-medium-amd64
  before_script:
    - Set-Variable -Name "time" -Value (date -Format "%H:%m")
    - echo ${time}
    - echo "started by ${GITLAB_USER_NAME}"

image: ubuntu:24.04

stages:
  - build
  - test
  - deploy

build:linux:
  stage: build
  tags:
    - gitlab-org
  before_script:
    - apt update && DEBIAN_FRONTEND=noninteractive apt -y install ninja-build cmake libboost-dev build-essential git clang-19 g++-14 curl libopengl-dev libglx-dev libgles-dev libdbus-1-dev libxcb*dev libxkb*dev libglib2.0-dev
    - curl -LsSf https://astral.sh/uv/install.sh | sh
    - source $HOME/.local/bin/env
    - uv venv && uv pip install aqtinstall
    - uv run aqt install-qt linux desktop 6.9.1
  script:
    - mkdir -p build
    - CC=clang-19 CXX=clang++-19 cmake -S $PWD -B build -GNinja -DCMAKE_PREFIX_PATH=$PWD/6.9.1/gcc_64
    - cmake --build build
  artifacts:
    expire_in: 2 hrs
    paths:
      - build/

build:windows:
  stage: build
  extends:
    - .shared_windows_runners
  before_script:
    - choco install -y cmake
    - choco install -y boost-msvc-14.3
  script:
    - cmake -S . -B build
    - cmake --build build
  artifacts:
    expire_in: 2 hrs
    paths:
      - build/

build:mac:
  stage: build
  extends:
    - .macos_saas_runners
  
  before_script:
    - brew update
    - brew install cmake boost
  script:
    - mkdir -p build
    - cmake -S $PWD -B build
    - cmake --build build
  artifacts:
    expire_in: 2 hrs
    paths:
      - build/

# Run test
test:linux:
  stage: test
  tags:
    - gitlab-org
  script:
    - ctest -V
  dependencies:
    - build:linux

test:windows:
  stage: test
  extends:
    - .shared_windows_runners
  script:
    - ctest -V
  dependencies:
    - build:windows

test:mac:
  stage: test
  extends:
    - .macos_saas_runners
  script:
    - ctest -V
  dependencies:
    - build:mac

