.macos_saas_runners:
  tags:
    - saas-macos-medium-m1
  image: macos-15-xcode-16
  before_script:
    - echo "started by ${GITLAB_USER_NAME}"

.shared_windows_runners:
  tags:
    - saas-windows-medium-amd64
  before_script:
    - Set-Variable -Name "time" -Value (date -Format "%H:%m")
    - echo ${time}
    - echo "started by ${GITLAB_USER_NAME}"

image: ubuntu:24.04

stages:
  - build
  - test
  - deploy

build:linux:
  stage: build
  tags:
    - gitlab-org
  before_script:
    # Install required packages including updated tools
    - apt update && DEBIAN_FRONTEND=noninteractive apt -y install ninja-build cmake libboost-dev build-essential git clang-19 g++-14 curl libopengl-dev libglx-dev libgles-dev libdbus-1-dev libxcb*dev libxkb*dev libglib2.0-dev wget xz-utils curl
    # Create sudo alias to bypass sudo requirement
    - alias sudo=
    # Download OSSIA SDK
    - curl -L -O "https://github.com/ossia/score/raw/master/tools/fetch-sdk.sh"
    - chmod +x fetch-sdk.sh
    - ./fetch-sdk.sh
  script:
    - mkdir -p build
    # Use OSSIA SDK's clang compiler
    - export PATH=/opt/ossia-sdk-x86_64/llvm/bin:$PATH
    - CC=/opt/ossia-sdk-x86_64/llvm/bin/clang CXX=/opt/ossia-sdk-x86_64/llvm/bin/clang++ cmake -S $PWD -B build -GNinja -DCMAKE_PREFIX_PATH="/opt/ossia-sdk-x86_64;/opt/ossia-sdk-x86_64/qt6-static;/opt/ossia-sdk-x86_64/qt6-static/lib;"
    - cmake --build build
  artifacts:
    expire_in: 2 hrs
    paths:
      - build/

build:windows:
  stage: build
  extends:
    - .shared_windows_runners
  before_script:
    # Install required tools with latest versions
    - choco install -y cmake --version=3.31.3
    - choco install -y ninja
    - choco install -y boost-msvc-14.3
    - choco install -y msys2
    # Download OSSIA SDK
    - curl -L -O "https://github.com/ossia/score/raw/master/tools/fetch-sdk.sh"
    - bash fetch-sdk.sh
  script:
    # Use OSSIA SDK's clang compiler for Windows
    - $env:PATH = "C:\ossia-sdk-x86_64\llvm\bin;$env:PATH"
    - cmake -S . -B build -GNinja -DCMAKE_C_COMPILER="C:/ossia-sdk-x86_64/llvm/bin/clang.exe" -DCMAKE_CXX_COMPILER="C:/ossia-sdk-x86_64/llvm/bin/clang++.exe" -DCMAKE_PREFIX_PATH="C:/ossia-sdk-x86_64;C:/ossia-sdk-x86_64/qt6-static;C:/ossia-sdk-x86_64/qt6-static/lib"
    - cmake --build build
  artifacts:
    expire_in: 2 hrs
    paths:
      - build/

build:mac:
  stage: build
  extends:
    - .macos_saas_runners
  
  before_script:
    # Update and install required tools
    - brew update
    - brew install cmake ninja boost
    # Ensure latest Xcode is selected
    - sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
    # Download OSSIA SDK
    - curl -L -O "https://github.com/ossia/score/raw/master/tools/fetch-sdk.sh"
    - chmod +x fetch-sdk.sh
    - ./fetch-sdk.sh
  script:
    - mkdir -p build
    # OSSIA SDK on macOS uses system compiler, just add SDK to prefix path
    - cmake -S $PWD -B build -GNinja -DCMAKE_PREFIX_PATH="/opt/ossia-sdk-aarch64"
    - cmake --build build
  artifacts:
    expire_in: 2 hrs
    paths:
      - build/

# Run test
test:linux:
  stage: test
  tags:
    - gitlab-org
  script:
    - cd build
    - ctest -V --output-on-failure
  dependencies:
    - build:linux

test:windows:
  stage: test
  extends:
    - .shared_windows_runners
  script:
    - cd build
    - ctest -V --output-on-failure
  dependencies:
    - build:windows

test:mac:
  stage: test
  extends:
    - .macos_saas_runners
  script:
    - cd build
    - ctest -V --output-on-failure
  dependencies:
    - build:mac

