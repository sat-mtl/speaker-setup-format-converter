name: Build

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

jobs:
  build-linux:
    name: linux-x86_64
    runs-on: ubuntu-latest
    container: almalinux:9
    env:
      SDK: /opt/ossia-sdk-x86_64

    steps:
      - name: Install dependencies
        shell: bash
        run: |
          yum -y update
          yum -y install epel-release dnf-plugins-core
          dnf config-manager --set-enabled crb
          yum -y update
          yum -y install \
            llvm-toolset gcc-toolset-14 \
            glibc-devel alsa-lib-devel mesa-libGL-devel libxkbcommon-x11-devel zlib-devel ncurses-devel \
            wget xz git cmake xcb-util xcb-util-devel libX11-devel libXrender-devel libXi-devel dbus-devel glib2-devel \
            nasm alsa-lib-devel libxcb-devel xcb-util-image xcb-util-keysyms xcb-util-image-devel xcb-util-renderutil-devel \
            vulkan vulkan-devel xcb-util-wm xcb-util-wm-devel libxkbcommon-devel libXcomposite-devel xcb-util-keysyms-devel \
            libv4l-devel xcb-util-cursor-devel pulseaudio-libs-devel \
            rsync bluez-libs-devel avahi-devel wayland-devel wayland-protocols-devel libwayland-egl libwayland-cursor libwayland-client \
            ninja-build libxkbfile-devel xorg-x11-proto-devel bzip2 systemd-devel systemd-udev mesa-libgbm-devel \
            file
          yum clean all

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Download OSSIA SDK
        shell: bash
        run: |
          curl -L -O "https://github.com/ossia/score/raw/master/tools/fetch-sdk.sh"
          chmod +x fetch-sdk.sh
          ./fetch-sdk.sh

      - name: Configure
        shell: bash
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=ON \
            -DBOOST_ROOT=$SDK/boost/include \
            -DOPENSSL_ROOT_DIR="$SDK/openssl" \
            -DCMAKE_PREFIX_PATH="$SDK/qt6-static;$SDK/openssl;$SDK/sysroot;$SDK/sysroot/lib/cmake/freetype;$SDK/sysroot/lib/cmake/harfbuzz" \
            -DCMAKE_C_COMPILER="$SDK/llvm/bin/clang" \
            -DCMAKE_CXX_COMPILER="$SDK/llvm/bin/clang++" \
            -DCMAKE_CXX_STANDARD_LIBRARIES="$SDK/sysroot/lib64/libfreetype.a" \
            -GNinja

      - name: Build
        shell: bash
        run: cmake --build build

      - name: Run tests
        shell: bash
        run: ctest --test-dir build --output-on-failure --no-tests=error

      - name: Package
        shell: bash
        # No FUSE in the container, so appimagetool has to unpack itself to run.
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: packaging/build-appimage.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: speaker-layout-converter-linux-x86_64
          path: packages/
          retention-days: 30

  build-macos:
    name: macos-arm
    runs-on: macos-latest
    env:
      SDK: /opt/ossia-sdk-aarch64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Download OSSIA SDK
        uses: ossia/actions/download-ossia-sdk@master

      - name: Configure
        shell: bash
        run: |
          # The aarch64 SDK keeps freetype/harfbuzz in their own top-level prefixes and
          # the image codecs in $SDK/lib, not under a sysroot/ as the x86_64 one does.
          # Both spellings are listed because a missing prefix is simply ignored.
          #
          # CMAKE_IGNORE_PREFIX_PATH is the load-bearing part: /opt/homebrew is a default
          # search prefix on arm64 macOS, so every codec Qt wants that the prefix path does
          # not resolve silently binds to a Homebrew dylib. That is how the .app ended up
          # with absolute load commands into /opt/homebrew/opt/{freetype,harfbuzz,webp,
          # jpeg-turbo} and could not launch on a Mac without Homebrew. Boost is the one
          # exception: it is header-only here, so taking its headers from Homebrew when the
          # SDK has none adds nothing to the link.
          #
          # In CI the SDK does have boost -- fetch-sdk.sh unpacks 1.90 into boost/include --
          # so the fallback below is for hand-installed SDKs that were assembled without it,
          # which is how the build machines here are set up. Keep that in mind when a result
          # is reproduced locally: those builds use a different boost from the one we ship.
          BOOST_INC="$SDK/boost/include"
          [[ -d "$BOOST_INC" ]] || BOOST_INC=/opt/homebrew/opt/boost/include

          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=ON \
            -DBOOST_ROOT="$BOOST_INC" \
            -DCMAKE_PREFIX_PATH="$SDK/qt6-static;$SDK;$SDK/freetype;$SDK/harfbuzz;$SDK/sysroot;$SDK/sysroot/lib/cmake/freetype;$SDK/sysroot/lib/cmake/harfbuzz" \
            -DCMAKE_IGNORE_PREFIX_PATH="/opt/homebrew;/usr/local" \
            -DCMAKE_FIND_FRAMEWORK=LAST \
            -GNinja

      - name: Build
        shell: bash
        run: cmake --build build

      - name: Run tests
        shell: bash
        run: ctest --test-dir build --output-on-failure --no-tests=error

      - name: Import signing certificate
        env:
          MAC_CERTIFICATE: ${{ secrets.MAC_CERTIFICATE }}
          MAC_CERTIFICATE_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
        shell: bash
        run: |
          # Guarded in the shell rather than with `if:`: a step's own env is not in scope
          # for its if-expression. On a fork or a secretless run this is a no-op and
          # build-macos-dmg.sh then produces an unsigned .dmg and says so, rather than
          # failing the whole matrix.
          if [[ -z "$MAC_CERTIFICATE" ]]; then
            echo "no MAC_CERTIFICATE secret: skipping, the .dmg will be unsigned"
            exit 0
          fi
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          security create-keychain -p "" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "" "$KEYCHAIN"
          echo "$MAC_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$MAC_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Package
        shell: bash
        env:
          MAC_CODESIGN_IDENTITY: ${{ secrets.MAC_CODESIGN_IDENTITY }}
        run: packaging/build-macos-dmg.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: speaker-layout-converter-macos-arm
          path: packages/
          retention-days: 30

  build-windows:
    name: windows
    runs-on: windows-latest
    env:
      SDK: c:/ossia-sdk-x86_64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Download OSSIA SDK
        uses: ossia/actions/download-ossia-sdk@master

      - name: Configure
        shell: bash
        run: |
          export PATH="/c/ossia-sdk-x86_64/llvm/bin:$PATH"

          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=ON \
            -DBOOST_ROOT=$SDK/boost/include \
            -DCMAKE_PREFIX_PATH="$SDK/qt6-static;$SDK/qt6-static/lib;$SDK/qt6-static/lib/cmake;$SDK/sysroot;$SDK/sysroot/lib/cmake/freetype;$SDK/sysroot/lib/cmake/harfbuzz" \
            -DCMAKE_C_COMPILER="$SDK/llvm/bin/clang.exe" \
            -DCMAKE_CXX_COMPILER="$SDK/llvm/bin/clang++.exe" \
            -GNinja

      - name: Build
        shell: bash
        run: |
          export PATH="/c/ossia-sdk-x86_64/llvm/bin:$PATH"
          cmake --build build

      - name: Run tests
        shell: bash
        run: |
          export PATH="/c/ossia-sdk-x86_64/llvm/bin:$PATH"
          ctest --test-dir build --output-on-failure --no-tests=error

      - name: Package
        shell: bash
        run: |
          export PATH="/c/ossia-sdk-x86_64/llvm/bin:$PATH"
          packaging/build-windows-zip.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: speaker-layout-converter-windows
          path: packages/
          retention-days: 30

  release:
    name: Create Release
    needs: [build-linux, build-macos, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-packages
          pattern: speaker-layout-converter-*
          merge-multiple: true

      - name: Create Release (on tags)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: all-packages/*
          draft: false
          prerelease: false
          generate_release_notes: true

      - name: Upload to Continuous Release (on main/master)
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          name: "Continuous Build"
          tag_name: "continuous"
          files: all-packages/*
          draft: false
          prerelease: true
          generate_release_notes: false
