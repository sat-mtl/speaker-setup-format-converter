<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#232a3d"/>
      <stop offset="1" stop-color="#12161f"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="256" height="256" rx="48" fill="url(#bg)"/>

  <!-- dome: the listening volume the layouts describe -->
  <path d="M 36 180 A 92 92 0 0 1 220 180" fill="none" stroke="#3f4a66" stroke-width="7"/>
  <path d="M 70 180 A 58 58 0 0 1 186 180" fill="none" stroke="#2f3850" stroke-width="5"/>
  <line x1="28" y1="180" x2="228" y2="180" stroke="#3f4a66" stroke-width="7" stroke-linecap="round"/>

  <!-- speakers on the ring, the objects actually being converted -->
  <circle cx="128" cy="88" r="11" fill="#f5c344"/>
  <circle cx="63"  cy="134" r="11" fill="#f5c344"/>
  <circle cx="193" cy="134" r="11" fill="#f5c344"/>
  <circle cx="99"  cy="180" r="11" fill="#6fc3dd"/>
  <circle cx="157" cy="180" r="11" fill="#6fc3dd"/>

  <!-- conversion: one layout in, another out -->
  <path d="M 94 216 L 162 216" fill="none" stroke="#e8ecf4" stroke-width="7" stroke-linecap="round"/>
  <path d="M 150 204 L 164 216 L 150 228" fill="none" stroke="#e8ecf4" stroke-width="7"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
